name: CI

# Plan H P2: lint, typecheck, UI build and the test suite against the PUBLIC corpora.
# The GBA subject (itnevres/pokemon-three-region) is private and is not available here, so the
# tests that need it skip; the skipped count is printed and pinned (EXPECTED_SKIPPED below) so a
# newly skipped corpus test cannot read as a pass (LESSONS, plan-h finding 34).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Measured 2026-11-24 on the pinned public corpora (500 pending, 0 todo). Bump deliberately when a test is added that skips here, or when the corpora change.
      EXPECTED_SKIPPED: "500"
      # Test files that read the private GBA subject at import time or assert its own data. Without
      # it they fail at collection (20 files, measured 2026-11-24), so they are excluded here and
      # run on the machine that has the subject. Follow-up: guard them with itWithCorpus so this
      # list can go. A reference engine standing in for the subject fails them too (subject data).
      SUBJECT_ONLY_TESTS: |
        packages/cli/test/query.test.ts
        packages/cli/test/renderWorld.test.ts
        packages/core/test/addEvent/gbaBuild.test.ts
        packages/core/test/addEvent/gbaCopy.test.ts
        packages/core/test/analyse/coverage.test.ts
        packages/core/test/load/encounters.test.ts
        packages/core/test/load/tilesetData.test.ts
        packages/core/test/render/layout.test.ts
        packages/core/test/render/metatile.test.ts
        packages/core/test/render/overlays.test.ts
        packages/core/test/render/species.test.ts
        packages/core/test/render/visual.test.ts
        packages/core/test/signs/charmap.test.ts
        packages/core/test/signs/suggest.test.ts
        packages/core/test/validate/metatileRange.test.ts
        packages/core/test/world/connections.test.ts
        packages/core/test/world/resolve.test.ts
        packages/core/test/world/warpGraph.test.ts
        packages/mcp/test/writes.test.ts
        packages/server/test/editSessions.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ESLint 10 needs >=20.19 / 22.13 / 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build -w packages/ui

      # The session-start hook is the single list of pinned corpus commits. With
      # CLAUDE_CODE_REMOTE=true it fetches them into $HOME/pokemap-corpus and writes a local
      # pokemap.config.json (git skip-worktree). The private GBA subject clone fails without
      # credentials; that is expected and handled by skipping.
      - name: Fetch public corpora
        env:
          CLAUDE_CODE_REMOTE: "true"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          bash .claude/hooks/session-start.sh < /dev/null
          # The hook only warns when a fetch fails; fail here so a missing corpus is not read as "update the pin".
          for d in refs/pokeemerald refs/pokefirered refs/pokeemerald-expansion refs/modern-emerald refs/pokeclassic pokecrystal-PerfPlus pokecrystal; do
            test -d "$HOME/pokemap-corpus/$d/.git" || { echo "corpus $d was not fetched" >&2; exit 1; }
          done

      - name: Test
        run: |
          # vitest's --exclude does not reach the projects in vitest.config.ts, so pass every other
          # test file as a filter instead.
          printf '%s\n' $SUBJECT_ONLY_TESTS | while read -r f; do test -f "$f" || { echo "SUBJECT_ONLY_TESTS lists $f, which does not exist; update the list in .github/workflows/ci.yml" >&2; exit 1; }; done
          echo 'If a test file fails at collection with a missing pokemon-three-region path, it needs the private GBA subject: guard it with itWithCorpus or add it to SUBJECT_ONLY_TESTS.'
          find packages -path '*/node_modules' -prune -o -path '*/test/*' \( -name '*.test.ts' -o -name '*.test.tsx' \) -print | sort > all-tests.txt
          printf '%s\n' $SUBJECT_ONLY_TESTS | sort > subject-only.txt
          grep -vxFf subject-only.txt all-tests.txt > run-tests.txt
          echo "running $(wc -l < run-tests.txt) of $(wc -l < all-tests.txt) test files; $(wc -l < subject-only.txt) need the private GBA subject"
          npx vitest run --no-file-parallelism --reporter=default --reporter=json --outputFile.json=vitest-results.json $(cat run-tests.txt)

      - name: Skipped count
        if: always()
        run: |
          node -e '
            if (!require("fs").existsSync("vitest-results.json")) { console.error("vitest wrote no results file; see the earlier failed step"); process.exit(1); }
            const r = JSON.parse(require("fs").readFileSync("vitest-results.json", "utf8"));
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(`tests: ${r.numTotalTests} total, ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${skipped} skipped (pending ${r.numPendingTests}, todo ${r.numTodoTests})`);
            const want = Number(process.env.EXPECTED_SKIPPED);
            if (skipped !== want) { console.error(`skipped count ${skipped} != pinned EXPECTED_SKIPPED ${want}; update it in .github/workflows/ci.yml if this is intended`); process.exit(1); }
          '
